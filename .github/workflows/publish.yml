name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun test

      # npm exchanges the GitHub Actions OIDC token with npm Trusted Publishing.
      # Do not add NODE_AUTH_TOKEN or a registry-url setup step here.
      - run: npm publish --access public --provenance
